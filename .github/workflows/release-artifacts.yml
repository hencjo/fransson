name: Release artifacts

on:
  push:
    tags:
      - 'fransson-v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing fransson-v<version> tag to build or rebuild
        required: true

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  linux-x86_64:
    name: Build Linux x86_64 GNU
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    env:
      BIN: fransson
      PACKAGE_PLATFORM: linux-x86_64-gnu
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: refs/tags/${{ github.event.inputs.tag || github.ref_name }}
          persist-credentials: false

      - name: Resolve release artifact
        id: release
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail

          tag="${RELEASE_TAG}"
          ./scripts/release --verify-tag "${tag}"
          version="${tag#fransson-v}"
          ./scripts/release --notes "${version}" > "${RUNNER_TEMP}/release-notes.md"

          package="${BIN}-${version}-${PACKAGE_PLATFORM}"
          archive="${package}.tar.gz"
          checksum="${archive}.sha256"

          {
            echo "tag=${tag}"
            echo "version=${version}"
            echo "package=${package}"
            echo "archive=${archive}"
            echo "checksum=${checksum}"
          } >> "${GITHUB_OUTPUT}"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes build-essential cmake libsasl2-dev pkg-config zlib1g-dev

      - name: Build release binary
        run: cargo build --release --locked

      - name: Verify dynamic dependencies
        shell: bash
        run: |
          set -euo pipefail

          deps="$(ldd "target/release/${BIN}")"
          printf '%s\n' "${deps}"
          if grep -Fq 'not found' <<< "${deps}"; then
            echo "Release binary has missing dynamic dependencies." >&2
            exit 1
          fi

          unexpected="$(
            awk '/=>/ { print $1 }' <<< "${deps}" |
              grep -Ev '^(libc|libdl|libgcc_s|libm|libpthread|libresolv|librt|libsasl2|libz)\.so(\.|$)' || true
          )"
          if [[ -n "${unexpected}" ]]; then
            echo "Undeclared dynamic dependencies:" >&2
            printf '%s\n' "${unexpected}" >&2
            exit 1
          fi

      - name: Package artifact
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "dist/pkg/${{ steps.release.outputs.package }}"
          cp "target/release/${BIN}" "dist/pkg/${{ steps.release.outputs.package }}/"
          cp README.md LICENSE "dist/pkg/${{ steps.release.outputs.package }}/"
          cp -R examples "dist/pkg/${{ steps.release.outputs.package }}/"
          tar \
            --owner=0 \
            --group=0 \
            --numeric-owner \
            -C dist/pkg \
            -czf "dist/${{ steps.release.outputs.archive }}" \
            "${{ steps.release.outputs.package }}"
          (cd dist && sha256sum "${{ steps.release.outputs.archive }}" > "${{ steps.release.outputs.checksum }}")

      - name: Smoke-test packaged binary
        shell: bash
        run: |
          set -euo pipefail

          docker run --rm \
            -v "${PWD}/dist/pkg/${{ steps.release.outputs.package }}:/artifact:ro" \
            ubuntu:22.04 \
            bash -ec 'apt-get update >/dev/null && apt-get install --yes libsasl2-2 libsasl2-modules zlib1g >/dev/null && /artifact/fransson --version'

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.release.outputs.archive }}
          path: |
            dist/${{ steps.release.outputs.archive }}
            dist/${{ steps.release.outputs.checksum }}

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          ARCHIVE: ${{ steps.release.outputs.archive }}
          CHECKSUM: ${{ steps.release.outputs.checksum }}
        run: |
          set -euo pipefail
          # List through the API so authorization/network failures are not mistaken
          # for an absent release. Pagination also finds older releases on rebuild.
          tags="$(gh api --paginate "repos/${GITHUB_REPOSITORY}/releases?per_page=100" --jq '.[].tag_name')"
          if ! grep -Fxq "${RELEASE_TAG}" <<< "${tags}"; then
            gh release create "${RELEASE_TAG}" --verify-tag --draft \
              --title "${RELEASE_TAG}" --notes-file "${RUNNER_TEMP}/release-notes.md"
          fi
          gh release upload "${RELEASE_TAG}" "dist/${ARCHIVE}" "dist/${CHECKSUM}" --clobber
          gh release edit "${RELEASE_TAG}" --draft=false \
            --notes-file "${RUNNER_TEMP}/release-notes.md"
