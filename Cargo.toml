[package]
name = "fransson"
version = "0.1.0"
edition = "2021"
description = "Reconcile, clone, stream, dump, and restore Kafka topics"
license = "Apache-2.0"
repository = "https://github.com/hencjo/fransson"

[[bin]]
name = "fransson"
path = "src/main.rs"

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"
opt-level = "z"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
futures-util = "0.3"
rdkafka = { version = "0.36", features = ["cmake-build", "tokio", "sasl", "ssl-vendored"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
sha2 = "0.10"
tokio = { version = "1.38", features = ["macros", "rt-multi-thread", "signal", "sync", "time"] }
zstd = "=0.13.3"
